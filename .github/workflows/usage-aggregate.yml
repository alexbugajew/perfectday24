name: Usage Score Aggregation

# KI-Qualitäts-Loop Stufe 2: aggregiert nächtlich die Plan-Auswahlen
# (ai_plan_applied + plan_save) zu einem gedämpften usage_score pro Location.
# Läuft nach dem Events-Refresh (02:43), damit sich die Jobs nicht überlappen.

on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

concurrency:
  group: usage-aggregate
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify env
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"

      - name: Aggregate usage scores
        run: npm run usage:aggregate
